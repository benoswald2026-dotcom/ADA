# Render blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Secrets marked sync: false are typed into Render's dashboard, never stored here.
services:
  - type: web
    name: hashmark
    runtime: python
    plan: free
    branch: claude/college-football-betting-model-wcgtge
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py serve
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: HASHMARK_PASSWORD
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: CFBD_API_KEY
        sync: false
